<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NetCDN - Distributed CDN Demo</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: #141414;
            color: #ffffff;
            overflow-x: hidden;
        }
        
        /* Netflix-style scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #141414;
        }
        ::-webkit-scrollbar-thumb {
            background: #333;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #555;
        }
        
        /* Card hover effects */
        .movie-card {
            transition: transform 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94), z-index 0s;
            transform-origin: center;
        }
        .movie-card:hover {
            transform: scale(1.05);
            z-index: 50;
            box-shadow: 0 20px 40px rgba(0,0,0,0.8);
        }
        
        /* Netflix spinner */
        .netflix-spinner {
            width: 50px;
            height: 50px;
            border: 3px solid rgba(229, 9, 20, 0.3);
            border-top-color: #E50914;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        /* Status pill pulse */
        .status-pulse {
            animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: .5; }
        }
        
        /* Toast animation */
        .toast-enter {
            animation: slideUp 0.3s ease-out;
        }
        @keyframes slideUp {
            from { transform: translate(-50%, 100%); opacity: 0; }
            to { transform: translate(-50%, 0); opacity: 1; }
        }
        
        /* Flashing refresh badge */
        .flash-badge {
            animation: flash 1s ease-in-out infinite;
        }
        @keyframes flash {
            0%, 100% { opacity: 1; background-color: #E50914; }
            50% { opacity: 0.7; background-color: #b20710; }
        }
        
        /* Gradient overlay for cards */
        .card-overlay {
            background: linear-gradient(to top, rgba(0,0,0,0.9) 0%, rgba(0,0,0,0.3) 50%, transparent 100%);
        }
        
        /* Play button hover */
        .play-btn {
            transition: all 0.2s ease;
        }
        .play-btn:hover {
            background-color: rgba(229, 9, 20, 0.9);
            transform: scale(1.1);
        }
        
        /* Technical panel glass effect */
        .tech-panel {
            background: rgba(20, 20, 20, 0.95);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        /* Disabled state */
        .disabled-card {
            opacity: 0.5;
            pointer-events: none;
            filter: grayscale(100%);
        }
        
        /* Error state */
        .error-state {
            background: rgba(229, 9, 20, 0.1);
            border: 1px solid #E50914;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col">

    <!-- Navbar -->
    <nav class="fixed top-0 left-0 right-0 z-50 bg-gradient-to-b from-black/80 to-transparent px-6 py-4 flex items-center justify-between">
        <div class="flex items-center gap-2">
            <span class="text-3xl font-bold text-[#E50914] tracking-tighter">NetCDN</span>
        </div>
        
        <div class="flex items-center gap-4">
            <div class="relative">
                <select id="locationSelect" class="bg-black/60 border border-gray-600 text-white px-4 py-2 rounded-md focus:outline-none focus:border-[#E50914] transition-colors cursor-pointer">
                    <option value="India">India</option>
                    <option value="US">US</option>
                    <option value="Europe">Europe</option>
                </select>
            </div>
        </div>
        
        <div class="flex items-center gap-3">
            <div id="edgeStatus" class="flex items-center gap-2 bg-green-500/20 border border-green-500/50 px-4 py-2 rounded-full">
                <span class="w-2 h-2 bg-green-500 rounded-full status-pulse"></span>
                <span class="text-sm font-medium text-green-400">Edge-A · Online</span>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="flex-1 pt-24 px-6 pb-32">
        <div class="mb-8">
            <h1 class="text-2xl font-bold mb-2">Distributed CDN Demo</h1>
            <p class="text-gray-400 text-sm">Select a location and click Play to simulate CDN edge node behavior</p>
        </div>

        <!-- Movie Grid -->
        <div id="movieGrid" class="grid grid-cols-2 md:grid-cols-4 gap-4 md:gap-6">
            <!-- Cards injected by JS -->
        </div>
    </main>

    <!-- Technical Overlay Panel -->
    <div class="fixed bottom-6 right-6 tech-panel rounded-lg p-4 w-80 shadow-2xl z-40">
        <div class="flex items-center justify-between mb-3">
            <h3 class="text-xs font-bold text-gray-400 uppercase tracking-wider">Edge Node Telemetry</h3>
            <div class="w-2 h-2 bg-green-500 rounded-full status-pulse"></div>
        </div>
        
        <div class="space-y-2 font-mono text-xs">
            <div class="flex justify-between">
                <span class="text-gray-500">Served by:</span>
                <span id="techEdge" class="text-white font-semibold">-</span>
            </div>
            <div class="flex justify-between items-center">
                <span class="text-gray-500">Status:</span>
                <span id="techStatus" class="px-2 py-0.5 rounded text-xs font-bold bg-gray-700 text-gray-300">IDLE</span>
            </div>
            <div class="flex justify-between">
                <span class="text-gray-500">Latency:</span>
                <span id="techLatency" class="text-white">-</span>
            </div>
            <div class="flex justify-between">
                <span class="text-gray-500">Location:</span>
                <span id="techLocation" class="text-[#E50914] font-semibold">India</span>
            </div>
            <div class="flex justify-between">
                <span class="text-gray-500">Edge IP:</span>
                <span id="techIP" class="text-gray-300">-</span>
            </div>
        </div>
        
        <div class="mt-3 pt-3 border-t border-gray-700">
            <div class="flex items-center gap-2 text-xs text-gray-500">
                <div class="w-2 h-2 rounded-full bg-green-500"></div>
                <span>HIT: Instant load</span>
                <div class="w-2 h-2 rounded-full bg-yellow-500 ml-2"></div>
                <span>MISS: 2s delay</span>
            </div>
        </div>
    </div>

    <!-- Toast Container -->
    <div id="toastContainer" class="fixed bottom-24 left-1/2 transform -translate-x-1/2 z-50"></div>

    <script>
        // Movie data
        const movies = [
            { id: 'movie_1', title: 'The Edge', genre: 'Action', poster: 'https://picsum.photos/300/450?random=1' },
            { id: 'movie_2', title: 'Cache Runner', genre: 'Sci-Fi', poster: 'https://picsum.photos/300/450?random=2' },
            { id: 'movie_3', title: 'Latency', genre: 'Thriller', genre: 'Thriller', poster: 'https://picsum.photos/300/450?random=3' },
            { id: 'movie_4', title: 'Origin Story', genre: 'Drama', poster: 'https://picsum.photos/300/450?random=4' },
            { id: 'movie_5', title: 'Node Runner', genre: 'Action', poster: 'https://picsum.photos/300/450?random=5' },
            { id: 'movie_6', title: 'The Purge', genre: 'Horror', poster: 'https://picsum.photos/300/450?random=6' },
            { id: 'movie_7', title: 'Distributed', genre: 'Documentary', poster: 'https://picsum.photos/300/450?random=7' },
            { id: 'movie_8', title: 'Edge of Tomorrow', genre: 'Sci-Fi', poster: 'https://picsum.photos/300/450?random=8' }
        ];

        // State
        let currentLocation = 'India';
        let isTrafficManagerAvailable = true;
        let currentEdgeUrl = null;
        let purgeInterval = null;
        let disabledCards = new Set();

        // DOM Elements
        const movieGrid = document.getElementById('movieGrid');
        const locationSelect = document.getElementById('locationSelect');
        const edgeStatus = document.getElementById('edgeStatus');
        const toastContainer = document.getElementById('toastContainer');

        // Technical overlay elements
        const techEdge = document.getElementById('techEdge');
        const techStatus = document.getElementById('techStatus');
        const techLatency = document.getElementById('techLatency');
        const techLocation = document.getElementById('techLocation');
        const techIP = document.getElementById('techIP');

        // Initialize
        function init() {
            renderMovies();
            locationSelect.value = currentLocation;
            locationSelect.addEventListener('change', handleLocationChange);
            startPurgePolling();
        }

        // Render movie cards
        function renderMovies() {
            movieGrid.innerHTML = movies.map(movie => `
                <div id="card-${movie.id}" class="movie-card relative rounded-md overflow-hidden bg-[#1a1a1a] cursor-pointer group aspect-[2/3]">
                    <img src="${movie.poster}" alt="${movie.title}" class="w-full h-full object-cover opacity-60 group-hover:opacity-100 transition-opacity">
                    
                    <!-- Loading Spinner Overlay -->
                    <div id="spinner-${movie.id}" class="absolute inset-0 flex items-center justify-center bg-black/80 hidden z-20">
                        <div class="netflix-spinner"></div>
                    </div>
                    
                    <!-- Error Overlay -->
                    <div id="error-${movie.id}" class="absolute inset-0 flex flex-col items-center justify-center bg-black/90 hidden z-30 error-state">
                        <svg class="w-12 h-12 text-[#E50914] mb-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/>
                        </svg>
                        <span class="text-[#E50914] font-bold text-sm">Edge Unavailable</span>
                    </div>
                    
                    <!-- Refreshing Badge -->
                    <div id="refresh-${movie.id}" class="absolute top-2 right-2 bg-[#E50914] text-white text-xs font-bold px-2 py-1 rounded hidden z-20 flash-badge">
                        Refreshing...
                    </div>
                    
                    <!-- Card Overlay -->
                    <div class="card-overlay absolute inset-0 opacity-0 group-hover:opacity-100 transition-opacity flex flex-col justify-end p-4">
                        <span class="text-[10px] font-bold text-[#E50914] uppercase tracking-wider mb-1">${movie.genre}</span>
                        <h3 class="text-lg font-bold mb-3 leading-tight">${movie.title}</h3>
                        <button onclick="handlePlay('${movie.id}')" id="btn-${movie.id}" class="play-btn w-full bg-[#E50914] hover:bg-[#f40612] text-white font-bold py-2 px-4 rounded flex items-center justify-center gap-2">
                            <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 20 20">
                                <path d="M6.3 2.841A1.5 1.5 0 004 4.11V15.89a1.5 1.5 0 002.3 1.269l9.344-5.89a1.5 1.5 0 000-2.538L6.3 2.84z"/>
                            </svg>
                            Play
                        </button>
                    </div>
                </div>
            `).join('');
        }

        // Handle location change
        async function handleLocationChange(e) {
            currentLocation = e.target.value;
            techLocation.textContent = currentLocation;
            showToast(`Location changed to ${currentLocation}`, 'info');
            
            // Reset edge discovery
            currentEdgeUrl = null;
            await discoverEdge();
        }

        // Discover edge node via Traffic Manager
        async function discoverEdge() {
            try {
                const controller = new AbortController();
                const timeoutId = setTimeout(() => controller.abort(), 5000);
                
                const response = await fetch(`http://192.168.1.14:5000/discover?location=${currentLocation}`, {
                    signal: controller.signal
                });
                clearTimeout(timeoutId);
                
                if (!response.ok) throw new Error('Traffic Manager error');
                
                const data = await response.json();
                currentEdgeUrl = data.edgeUrl;
                isTrafficManagerAvailable = true;
                
                // Update status
                updateEdgeStatus('online', data.edgeUrl);
                enableAllCards();
                
                return data.edgeUrl;
            } catch (error) {
                isTrafficManagerAvailable = false;
                updateEdgeStatus('offline');
                showToast('Traffic Manager Unavailable', 'error');
                disableAllCards();
                return null;
            }
        }

        // Handle play button click
        async function handlePlay(movieId) {
            if (disabledCards.has(movieId)) return;
            
            // Show spinner immediately for visual feedback
            const spinner = document.getElementById(`spinner-${movieId}`);
            spinner.classList.remove('hidden');
            
            try {
                // Step 1: Discover edge if not already done
                if (!currentEdgeUrl) {
                    const edgeUrl = await discoverEdge();
                    if (!edgeUrl) throw new Error('No edge available');
                }
                
                // Step 2: Fetch movie data from edge
                const controller = new AbortController();
                const timeoutId = setTimeout(() => controller.abort(), 5000);
                
                const response = await fetch(`${currentEdgeUrl}/data/${movieId}`, {
                    signal: controller.signal
                });
                clearTimeout(timeoutId);
                
                if (!response.ok) throw new Error('Edge error');
                
                const data = await response.json();
                
                // Handle cache miss delay
                if (data.cacheStatus === 'MISS') {
                    await new Promise(resolve => setTimeout(resolve, 2000));
                }
                
                // Hide spinner
                spinner.classList.add('hidden');
                
                // Update technical overlay
                updateTechOverlay(data);
                
                // Show success toast
                const statusColor = data.cacheStatus === 'HIT' ? 'green' : 'yellow';
                showToast(`${data.title} - ${data.cacheStatus} (${data.latency}ms)`, statusColor);
                
            } catch (error) {
                spinner.classList.add('hidden');
                
                // Show error state on card
                const errorDiv = document.getElementById(`error-${movieId}`);
                errorDiv.classList.remove('hidden');
                disabledCards.add(movieId);
                
                // Update card visual state
                const card = document.getElementById(`card-${movieId}`);
                card.classList.add('disabled-card');
                
                showToast('Edge Unavailable', 'error');
            }
        }

        // Update technical overlay panel
        function updateTechOverlay(data) {
            techEdge.textContent = data.servedBy || '-';
            techLatency.textContent = data.latency ? `${data.latency}ms` : '-';
            
            const statusEl = document.getElementById('techStatus');
            if (data.cacheStatus === 'HIT') {
                statusEl.textContent = 'CACHE HIT';
                statusEl.className = 'px-2 py-0.5 rounded text-xs font-bold bg-green-500/20 text-green-400 border border-green-500/50';
            } else if (data.cacheStatus === 'MISS') {
                statusEl.textContent = 'CACHE MISS';
                statusEl.className = 'px-2 py-0.5 rounded text-xs font-bold bg-yellow-500/20 text-yellow-400 border border-yellow-500/50';
            }
            
            // Extract IP from edgeUrl if available
            if (currentEdgeUrl) {
                const ipMatch = currentEdgeUrl.match(/192\.168\.1\.\d+/);
                techIP.textContent = ipMatch ? ipMatch[0] : '-';
            }
        }

        // Update edge status pill
        function updateEdgeStatus(status, edgeUrl) {
            if (status === 'online') {
                const edgeMatch = edgeUrl.match(/Edge-[A-C]/);
                const edgeName = edgeMatch ? edgeMatch[0] : 'Edge-A';
                
                edgeStatus.className = 'flex items-center gap-2 bg-green-500/20 border border-green-500/50 px-4 py-2 rounded-full';
                edgeStatus.innerHTML = `
                    <span class="w-2 h-2 bg-green-500 rounded-full status-pulse"></span>
                    <span class="text-sm font-medium text-green-400">${edgeName} · Online</span>
                `;
            } else {
                edgeStatus.className = 'flex items-center gap-2 bg-red-500/20 border border-red-500/50 px-4 py-2 rounded-full';
                edgeStatus.innerHTML = `
                    <span class="w-2 h-2 bg-red-500 rounded-full"></span>
                    <span class="text-sm font-medium text-red-400">Offline</span>
                `;
            }
        }

        // Disable all cards when traffic manager is down
        function disableAllCards() {
            movies.forEach(movie => {
                const card = document.getElementById(`card-${movie.id}`);
                const btn = document.getElementById(`btn-${movie.id}`);
                card.classList.add('disabled-card');
                btn.disabled = true;
            });
        }

        // Enable all cards
        function enableAllCards() {
            movies.forEach(movie => {
                const card = document.getElementById(`card-${movie.id}`);
                const btn = document.getElementById(`btn-${movie.id}`);
                const errorDiv = document.getElementById(`error-${movie.id}`);
                
                card.classList.remove('disabled-card');
                btn.disabled = false;
                errorDiv.classList.add('hidden');
            });
            disabledCards.clear();
        }

        // Show toast notification
        function showToast(message, type = 'info') {
            const toast = document.createElement('div');
            
            let bgClass, borderClass, textClass;
            switch(type) {
                case 'error':
                    bgClass = 'bg-red-500/90';
                    borderClass = 'border-red-600';
                    textClass = 'text-white';
                    break;
                case 'green':
                    bgClass = 'bg-green-500/90';
                    borderClass = 'border-green-600';
                    textClass = 'text-white';
                    break;
                case 'yellow':
                    bgClass = 'bg-yellow-500/90';
                    borderClass = 'border-yellow-600';
                    textClass = 'text-black';
                    break;
                default:
                    bgClass = 'bg-gray-800/90';
                    borderClass = 'border-gray-600';
                    textClass = 'text-white';
            }
            
            toast.className = `${bgClass} border ${borderClass} ${textClass} px-6 py-3 rounded-lg shadow-2xl font-medium text-sm toast-enter backdrop-blur-sm`;
            toast.textContent = message;
            
            toastContainer.appendChild(toast);
            
            setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.transform = 'translate(-50%, 100%)';
                toast.style.transition = 'all 0.3s ease';
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

        // Poll purge status every 5 seconds
        function startPurgePolling() {
            purgeInterval = setInterval(async () => {
                try {
                    const controller = new AbortController();
                    const timeoutId = setTimeout(() => controller.abort(), 3000);
                    
                    const response = await fetch('http://192.168.1.14:5000/purge-status', {
                        signal: controller.signal
                    });
                    clearTimeout(timeoutId);
                    
                    if (!response.ok) return;
                    
                    const data = await response.json();
                    
                    if (data.purged && data.id) {
                        // Show toast
                        showToast('Cache Updated — fetching fresh content', 'info');
                        
                        // Flash refresh badge on affected card
                        const refreshBadge = document.getElementById(`refresh-${data.id}`);
                        if (refreshBadge) {
                            refreshBadge.classList.remove('hidden');
                            setTimeout(() => {
                                refreshBadge.classList.add('hidden');
                            }, 3000);
                        }
                    }
                } catch (error) {
                    // Silently fail on purge poll errors
                }
            }, 5000);
        }

        // Initialize on load
        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
